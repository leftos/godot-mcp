name: Gates
description: >-
  Sets up the .NET SDK global.json names and Godot 4.7.2, then runs the warnings-as-errors build, the unit tests and
  the GDScript unit tests through run.ps1. The caller checks the repository out first.

runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    # The official 4.7.2 stable win64 build (https://github.com/godotengine/godot/releases/tag/4.7.2-stable), checked
    # against the sha256 digest GitHub lists for the asset.
    - name: Download Godot 4.7.2
      shell: pwsh
      env:
        GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip
        GODOT_SHA256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
        GODOT_DIR: ${{ runner.temp }}\godot
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
        Invoke-WebRequest -Uri $env:GODOT_URL -OutFile $zip
        $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
        if ($actual -ne $env:GODOT_SHA256) {
          throw "Godot download $($env:GODOT_URL) has sha256 $actual, not $($env:GODOT_SHA256)."
        }
        Expand-Archive -LiteralPath $zip -DestinationPath $env:GODOT_DIR
        Get-ChildItem -LiteralPath $env:GODOT_DIR -Name

    - name: Build (warnings as errors)
      shell: pwsh
      run: ./run.ps1 build

    - name: Unit tests
      shell: pwsh
      run: ./run.ps1 test

    - name: GDScript unit tests
      shell: pwsh
      env:
        GODOT_PATH: ${{ runner.temp }}\godot\Godot_v4.7.2-stable_win64_console.exe
      run: ./run.ps1 gdtest
