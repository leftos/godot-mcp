# prek hooks (prek install; prek run --all-files). The format check runs first, cs-line-length then catches the C# lines
# over 150 characters that CSharpier does not wrap (comments), and the warnings-as-errors build gates the result;
# gdlint checks the GDScript the server ships, and gdcomplexity holds it to the same complexity and length limits as
# the C#. Ruff (ruff.toml) checks the Python tools. No hook runs a test suite: `run.ps1 test`, `gdtest` and `pytest`
# run by hand.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(bat|cmd)$'

  - repo: local
    hooks:
      - id: csharpier
        name: csharpier check
        entry: pwsh -NoProfile -File run.ps1 format-check
        language: system
        pass_filenames: false
        types: [c#]
      - id: cs-line-length
        name: C# line length
        entry: uv run --quiet python tools/linelength.py
        language: system
        types: [c#]
      - id: dotnet-build
        name: dotnet build -warnaserror
        entry: pwsh -NoProfile -File run.ps1 build
        language: system
        pass_filenames: false
        files: \.(cs|csproj|props|slnx|editorconfig)$|^global\.json$
      - id: gdformat
        name: gdformat check
        entry: gdformat --check
        language: system
        files: ^(bridge|headless|tests/fixtures|tests/bridge)/.*\.gd$
      - id: gdlint
        name: gdlint
        entry: gdlint
        language: system
        files: ^(bridge|headless|tests/bridge)/.*\.gd$
      - id: gdcomplexity
        name: GDScript complexity and length
        entry: uv run --quiet --with "gdtoolkit>=4,<5" tools/gdcomplexity.py
        language: system
        files: ^(bridge|headless)/.*\.gd$
      - id: ruff-format
        name: ruff format check
        entry: uvx ruff@0.16.9 format --check
        language: system
        files: ^(tools|tests/tools)/.*\.py$
      - id: ruff-check
        name: ruff check
        entry: uvx ruff@0.16.9 check
        language: system
        files: ^(tools|tests/tools)/.*\.py$
